
<div  class="mt-6p-5 shadow-lg h-full rounded-2xl bg-gray-50 border border-gray-200 p-5 ">
 
    <!-- section tilte-->
     <div class=" pb-3 border-b ">
        <h3 class=" text-xl font-bold text-center text-gray-700 tracking-wide"> Categories</h3>
     </div>
     <!-- Accordian-->
      <div class="mt-4 rounded-t-2xl space-y-3"> 
        @for (mainCategory of getCategories(); track $index){

         
         <details class="group  rounded-t-xl bg-white border border-gray-200">
            <summary class="flex flex-row items-center justify-between cursor-pointer list-none px-5 py-3 bg-blue-100 ">
                <span class="text-gray-700 font-bold "> {{mainCategory.category}}</span>
                <fa-icon [icon]="faAngledown" class="transform transition-transform
            group-open:rotate-180 text-gray-500 "></fa-icon>
            </summary>
            
            <div class="px-5  py-4">
                <ul class="space-y-3">
                    @for(   subcategories of getCategories(mainCategory.id);track $index  ){
                    <li class="text-center">
                        <a href="" class="text-gray-700 inline-block 
                        relative after:block  after:h-0.5 font-medium
                         after:bg-blue-500 after::origin-left 
                         after:scale-x-0 hover:after:scale-x-100 
                         after:transition-transform 
                         after:duration-300"> {{subcategories.category}}</a>
                    </li>
                }
                   
                </ul>
            </div>
         </details>
        }
      </div>
</div>
