<div class="w-full shadow-lg shadow-gray-500/50 bg-gray-900">
  <div class="flex items-center">
    <div class="text-white ml-2 p-3 w-[23%]">
      <h1 class="text-xl font-bold">eStore</h1>
    </div>
    <div class="flex p-0 my-4 w-[50%] h-10 bg-white items-center rounded-md">
      <select class="w-auto rounded-l-md bg-gray-300 h-full border-none font-semibold px-2 pr-5">
        <option>Men</option>
        <option>women</option>
        <option>Kids</option>
      </select>
      <input
        class="w-[90%] h-full inline-block border-none outline-none px-3"
        placeholder="Search.."
      />
      <button
        class="w-[10%] h-10 border-none bg-gray-300 flex justify-center rounded-r-md items-center"
      >
        <fa-icon [icon]="faSearch"></fa-icon>
      </button>
    </div>
    <div class="flex justify-end h-full items-center gap-6 w-[27%]">
      <div class="flex items-center text-white">
        <fa-icon [icon]="usericon" class="text-[1.3em]"> </fa-icon>
        <h5>
          <a href="" class="text-white no-underline hover:underline"> Sign in</a>
        </h5>
        <span>/</span>

        <h5>
          <a href="" class="text-white no-underline hover:underline"> Register</a>
        </h5>
      </div>
      <div class="flex items-center gap-4 text-white text-[1.3em]">
        <fa-icon [icon]="hearticon"> </fa-icon>
        <fa-icon [icon]="shoppingcarticon"> </fa-icon>
      </div>
    </div>
  </div>
</div>
